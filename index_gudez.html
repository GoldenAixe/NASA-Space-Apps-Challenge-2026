<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AstroQuest</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05060f;
        --pn: rgba(10, 13, 34, 0.88);
        --ink: #eaf2ff;
        --ac: #4fd8ff;
        --hi: #ffd23f;
        --mu: #8fa0c8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #03040b;
          --pn: rgba(6, 8, 24, 0.92);
        }
      }
      :root[data-theme="dark"] {
        --bg: #03040b;
        --pn: rgba(6, 8, 24, 0.92);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font:
          21px/1.15 VT323,
          ui-monospace,
          Menlo,
          monospace;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        touch-action: none;
      }
      .f,
      .lb,
      .pb,
      .tl,
      .lk {
        font-family: Silkscreen, ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .px {
        background: var(--pn);
        box-shadow:
          -4px 0 0 var(--ac),
          4px 0 0 var(--ac),
          0 -4px 0 var(--ac),
          0 4px 0 var(--ac),
          inset 0 0 0 2px rgba(79, 216, 255, 0.16);
      }
      .pb {
        font-size: 12px;
        background: var(--hi);
        color: #1a1630;
        border: 0;
        padding: 10px 14px;
        margin: 4px;
        cursor: pointer;
        box-shadow:
          -3px 0 #000,
          3px 0 #000,
          0 -3px #000,
          0 3px #000;
      }
      .pb:hover {
        filter: brightness(1.15);
      }
      .pb:active {
        transform: translateY(2px);
      }
      .pb.alt {
        background: #2c3a6e;
        color: var(--ink);
      }
      button:focus-visible {
        outline: 3px dashed var(--hi);
        outline-offset: 3px;
      }
      #top {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        z-index: 3;
        pointer-events: none;
      }
      #top > * {
        pointer-events: auto;
      }
      #cr {
        padding: 8px 12px;
        font-size: 20px;
      }
      .lk {
        font-size: 11px;
        background: none;
        border: 0;
        color: var(--ac);
        cursor: pointer;
        padding: 2px;
      }
      #cr b {
        font-family: Silkscreen, monospace;
        font-size: 11px;
        color: var(--hi);
      }
      #rt {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      #ct {
        padding: 8px 10px;
        font-size: 11px;
        color: var(--hi);
      }
      #tr {
        position: fixed;
        left: 16px;
        top: calc(76px + env(safe-area-inset-top, 0px));
        z-index: 3;
        padding: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 210px;
      }
      #tr.off {
        display: none;
      }
      .tl {
        font-size: 10px;
        background: none;
        border: 0;
        color: var(--ink);
        padding: 5px 4px;
        cursor: pointer;
        text-align: left;
      }
      .tl.on {
        color: #1a1630;
        background: var(--hi);
      }
      #lbs {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      .lb {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: auto;
        background: none;
        border: 0;
        color: var(--hi);
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        text-shadow:
          2px 0 #000,
          -2px 0 #000,
          0 2px #000,
          0 -2px #000;
        padding: 6px 8px;
      }
      .lb:after {
        content: "\25BC";
        display: block;
        text-align: center;
        font-size: 10px;
      }
      #ms {
        position: fixed;
        left: 0;
        right: 0;
        top: 20%;
        text-align: center;
        z-index: 4;
        pointer-events: none;
        font-size: clamp(14px, 3.4vw, 24px);
        color: var(--hi);
        text-shadow:
          3px 0 #000,
          -3px 0 #000,
          0 3px #000,
          0 -3px #000;
        min-height: 1em;
      }
      #pn {
        position: fixed;
        right: 18px;
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        width: min(410px, calc(100% - 36px));
        max-height: 64vh;
        overflow: auto;
        z-index: 5;
        padding: 14px 16px;
        transform: translateY(130%);
        transition: transform 0.35s steps(6);
        box-sizing: border-box;
      }
      #pn.open {
        transform: none;
      }
      #pn h2 {
        font-size: 15px;
        margin: 6px 0 8px;
        line-height: 1.35;
      }
      #pn p {
        margin: 7px 0;
        line-height: 1.1;
      }
      #pn p b {
        font-family: Silkscreen, monospace;
        font-size: 10px;
        color: var(--ac);
        display: block;
        font-weight: 400;
      }
      .sl {
        height: 5px;
        margin: 0 0 6px;
        background: repeating-linear-gradient(
          90deg,
          var(--ac) 0 6px,
          transparent 6px 12px
        );
        animation: sl 0.8s steps(6) infinite;
      }
      @keyframes sl {
        to {
          background-position: 12px 0;
        }
      }
      .st {
        font-size: 10px;
        color: var(--hi);
      }
      #ti {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        pointer-events: none;
        z-index: 6;
        opacity: 0;
      }
      #ti.show {
        animation: ti 2.6s steps(12) forwards;
      }
      @keyframes ti {
        0% {
          opacity: 0;
          transform: scale(1.5);
        }
        12% {
          opacity: 1;
          transform: none;
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #ti h3 {
        margin: 0;
        font-size: 13px;
        color: var(--ac);
      }
      #ti h1 {
        margin: 8px 0;
        font-size: clamp(26px, 7vw, 56px);
        color: var(--hi);
        text-shadow:
          4px 0 #000,
          -4px 0 #000,
          0 4px #000,
          0 -4px #000;
      }
      #ti p {
        margin: 0;
        font-size: 26px;
      }
      #fx {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 4;
      }
      #mn {
        position: fixed;
        inset: 0;
        z-index: 8;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        background: rgba(3, 4, 12, 0.55);
      }
      #mn[hidden] {
        display: none;
      }
      #mb {
        max-width: 760px;
        width: 100%;
        padding: 18px 20px;
        margin: auto;
      }
      #mb h1 {
        font-size: clamp(24px, 6vw, 44px);
        margin: 0;
        color: var(--hi);
        text-shadow:
          4px 0 #000,
          -4px 0 #000,
          0 4px #000,
          0 -4px #000;
      }
      #mb > p {
        margin: 8px 0 14px;
        color: var(--mu);
      }
      #cl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
        margin: 8px 4px 12px;
      }
      .cd {
        font: inherit;
        text-align: left;
        color: var(--ink);
        background: rgba(44, 58, 110, 0.5);
        border: 0;
        padding: 10px 12px;
        cursor: pointer;
        box-shadow:
          -3px 0 var(--ac),
          3px 0 var(--ac),
          0 -3px var(--ac),
          0 3px var(--ac);
      }
      .cd:hover:not(:disabled) {
        background: rgba(79, 216, 255, 0.22);
      }
      .cd:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .cd i {
        display: block;
        font-family: Silkscreen, monospace;
        font-style: normal;
        font-size: 10px;
        color: var(--ac);
      }
      .cd b {
        display: block;
        font-family: Silkscreen, monospace;
        font-size: 15px;
        color: var(--hi);
        margin: 3px 0 5px;
        font-weight: 400;
      }
      .cd small {
        font-size: 18px;
        color: var(--mu);
        line-height: 1;
      }
      @media (max-width: 700px) {
        #tr {
          max-width: 170px;
        }
        #pn {
          left: 18px;
          width: auto;
        }
        .lb {
          font-size: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sl {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="top">
      <div id="cr" class="px"></div>
      <div id="rt">
        <div id="ct" class="px f"></div>
        <button class="pb" data-a="tg" aria-label="Toggle map">Map</button
        ><button class="pb alt" data-a="menu">Worlds</button
        ><button class="pb alt" data-a="mute" id="mu" aria-label="Sound">
          Snd
        </button>
      </div>
    </div>
    <div id="tr" class="px"></div>
    <div id="lbs"></div>
    <div id="ms" class="f"></div>
    <div id="pn" class="px" role="dialog" aria-live="polite"></div>
    <div id="ti">
      <div>
        <h3 class="f"></h3>
        <h1 class="f"></h1>
        <p></p>
      </div>
    </div>
    <div id="fx"></div>
    <div id="mn">
      <div id="mb" class="px">
        <h1 class="f">AstroQuest</h1>
        <p>
          A pixel-space museum. Pick a world, drive the rover, scan what
          humanity left behind. Drag to look around.
        </p>
        <div id="cl"></div>
        <button class="pb alt" data-a="mx" id="mx" hidden>Close</button>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const $ = (i) => document.getElementById(i),
        sm = (x) => {
          x = Math.max(0, Math.min(1, x));
          return x * x * (3 - 2 * x);
        };
      /* ---------- world data ---------- */
      const C = [
        {
          n: "MOON",
          t: "THE MOON",
          q: "Earth’s closest neighbor.",
          sky: 0x070a1a,
          gr: [0xa4a4b0, 0x8c8c9a],
          mt: 0x707080,
          rk: 0x6a6a78,
          tr: 0x5a5a68,
          hs: 0xdde4ff,
          hg: 0x444458,
          sc: 0xffffff,
          lt: 1.15,
          amp: 0.3,
          mh: 1,
          cr: [
            [4, -26, 7],
            [-8, -8, 4],
            [14, -10, 4],
            [-22, 10, 5],
          ],
          st: 1,
          es: 1,
          v: [0.1, 0.5, 0xffffff],
          subs: [
            {
              id: "1.1",
              sn: "LRO",
              b: "lro",
              p: [-12, -18],
              fl: 9,
              full: "Lunar Reconnaissance Orbiter",
              stt: "ACTIVE",
              loc: "Moon orbit",
              rows: [
                [
                  "Purpose",
                  "Maps the Moon in fine detail to help plan safe landings and find resources.",
                ],
                [
                  "Design",
                  "Seven science instruments, two solar arrays and a steerable dish for sending data to Earth.",
                ],
                [
                  "Mission",
                  "Launched in June 2009 into a polar orbit that passes over both poles.",
                ],
                [
                  "Discovery",
                  "Its data helped reveal ice-rich patches in permanently shadowed craters and photographed the Apollo landing sites.",
                ],
              ],
            },
            {
              id: "1.2",
              sn: "Apollo rover",
              b: "lrv",
              p: [11, -14],
              full: "Apollo Lunar Roving Vehicle",
              stt: "Retired 1972",
              loc: "Moon surface",
              rows: [
                [
                  "Purpose",
                  "Let astronauts travel farther from the lander and carry tools and samples.",
                ],
                [
                  "Design",
                  "Wheels woven from zinc-coated steel wire, because rubber would not survive the cold and dust.",
                ],
                [
                  "Mission",
                  "Apollo 15 in 1971 was the first to carry one. Its crew drove about 28 kilometers.",
                ],
                [
                  "Fact",
                  "Three of these rovers (Apollo 15, 16 and 17) were left behind on the Moon.",
                ],
              ],
            },
            {
              id: "1.3",
              sn: "Lunar equipment",
              b: "eq",
              p: [-17, -3],
              full: "Apollo Surface Equipment",
              stt: "Silent",
              loc: "Landing sites",
              rows: [
                [
                  "Stations",
                  "Experiment packages left by Apollo 12 to 17 ran on a small nuclear generator and sent data to Earth until 1977.",
                ],
                [
                  "Mirrors",
                  "The Apollo 11, 14 and 15 crews left reflectors that scientists still bounce lasers off to measure the Moon’s distance.",

                [
                  "Flags",
                  "A flag was planted at each of the six crewed landing sites.",
                ],
              ],
            },
            {
              id: "1.4",
              sn: "Discoveries",
              b: "ice",
              p: [4, -26],
              full: "Water Ice in the Shadows",
              stt: "Confirmed",
              loc: "Polar craters",
              rows: [
                [
                  "Ice",
                  "In 2009 NASA’s LCROSS probe hit the crater Cabeus, and the debris plume contained water.",
                ],
                [

                [

              ],
            },
            {
              id: "1.5",
              sn: "Timeline",
              b: "term",
              p: [17, 3],
              full: "Moon Mission Timeline",
              stt: "Archive",
              loc: "Mission log",
              rows: [
                [
                  "1959",

                ],
                [

                ],
                ["1971", "Apollo 15 drives the first Moon rover."],
                ["1972", "Apollo 17 is the last crewed landing."],
                ["2009", "LRO launches and LCROSS finds water."],
              ],
            },
          ],
        },
        {
          n: "MARS",
          t: "MARS",
          q: "Rust, dust and silent rovers.",
          sky: 0xd9915c,
          gr: [0xc4552a, 0xae4521],
          mt: 0x93401f,
          rk: 0x7d3419,
          tr: 0x7a3418,
          hs: 0xffe0c0,
          hg: 0x6a2e18,
          sc: 0xffd9b0,
          lt: 1.2,
          amp: 0.8,
          mh: 1.5,
          cr: [
            [-4, -26, 5],
            [18, -8, 4],
          ],
          st: 0,
          es: 0.1,
          v: [-6, 0.3, 0xffb070],
          subs: [
            {
              id: "2.1",
              sn: "Opportunity",
              b: "opp",
              p: [-12, -15],
              full: "Opportunity Rover",
              stt: "Mission ended 2019",
              loc: "Meridiani Planum",
              rows: [
                [
                  "Purpose",
                  "Find rocks that show whether ancient Mars had liquid water.",
                ],
                [
                  "Design",
                  "Six wheels on a rocker-bogie suspension, solar panels, and Pancam cameras on a mast.",
                ],
                [
                  "Mission",
                  "Landed in January 2004 for a planned 90 Martian days and kept working until 2018.",
                ],
                [
                  "Discovery",
                  "Found layered rock and iron-rich spheres that point to long-lasting watery conditions.",
                ],
              ],
            },
            {
              id: "2.2",
              sn: "Viking 1",
              b: "vk",
              p: [12, -16],
              full: "Viking 1 Lander",
              stt: "Retired 1982",
              loc: "Chryse Planitia",
              rows: [
                [
                  "Purpose",
                  "Study the surface and test the soil for signs of life.",
                ],
                [
                  "Design",
                  "Three legs, a robotic arm for scooping soil, and cameras that sent back some of the first clear surface pictures.",
                ],
                ["Mission", "Landed on July 20, 1976 and worked until 1982."],
              ],
            },
            {
              id: "2.3",
              sn: "Discoveries",
              b: "blue",
              p: [-4, -26],
              full: "Surface Discoveries",
              stt: "Evidence",
              loc: "Meridiani Planum",
              rows: [
                [
                  "Blueberries",
                  "Opportunity found tiny round iron-rich pebbles nicknamed blueberries.",
                ],
                [
                  "Meaning",
                  "They formed in water-soaked rock, a sign of past groundwater.",
                ],
                [
                  "Quakes",
                  "InSight’s seismometer detected hundreds of marsquakes before the mission ended in 2022.",
                ],
              ],
            },
            {
              id: "2.4",
              sn: "Timeline",
              b: "term",
              p: [17, 2],
              full: "Mars Mission Timeline",
              stt: "Archive",
              loc: "Mission log",
              rows: [
                [
                  "1965",
                  "Mariner 4 sends the first close-up pictures of Mars.",
                ],
                ["1976", "Viking 1 and 2 land."],
                ["1997", "Sojourner becomes the first Mars rover."],
                ["2004", "Spirit and Opportunity land."],
                ["2012", "Curiosity lands."],
                ["2021", "Perseverance lands with the Ingenuity helicopter."],
              ],
            },
          ],
        },
        {
          n: "DEEP SPACE",
          t: "DEEP SPACE",
          lock: 1,
          subs: [
            { id: "3.1", sn: "Voyager" },
            { id: "3.2", sn: "Deep Space Comms" },
            { id: "3.3", sn: "Discoveries" },
            { id: "3.4", sn: "Mission Status" },
          ],
        },
        { n: "OUTER SOLAR SYSTEM", t: "OUTER SOLAR SYSTEM", lock: 1, subs: [] },
      ];
      /* ---------- renderer ---------- */
      const R = new THREE.WebGLRenderer({ antialias: false });
      document.body.prepend(R.domElement);
      R.shadowMap.enabled = true;
      R.shadowMap.type = THREE.BasicShadowMap;
      const sc = new THREE.Scene(),
        cam = new THREE.PerspectiveCamera(60, 1, 0.1, 500),
        BLK = new THREE.Color(0x03040a),
        sky = new THREE.Color(0x03040a);
      sc.fog = new THREE.Fog(0x03040a, 30, 95);
      sc.background = new THREE.Color(0x03040a);
      function rs() {
        const p = Math.max(2, Math.round(innerHeight / 260));
        R.setSize(Math.ceil(innerWidth / p), Math.ceil(innerHeight / p), false);
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
      }
      addEventListener("resize", rs);
      rs();
      const amb = new THREE.HemisphereLight(0xffffff, 0x555566, 0.8),
        sun = new THREE.DirectionalLight(0xffffff, 1);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      {
        const s = sun.shadow.camera;
        s.left = s.bottom = -24;
        s.right = s.top = 24;
        s.near = 1;
        s.far = 90;
      }
      sc.add(amb, sun, sun.target);
      const W = new THREE.Group(),
        mts = new THREE.Group(),
        rocks = new THREE.Group(),
        props = new THREE.Group();
      W.add(mts, rocks, props);
      sc.add(W);
      /* ---------- voxel helpers ---------- */
      const UB = new THREE.BoxGeometry(1, 1, 1),
        UE = new THREE.EdgesGeometry(UB),
        OL = new THREE.LineBasicMaterial({ color: 0x0a0a14 }),
        MC = {};
      const L = (c, e) =>
        MC[c + "_" + (e | 0)] ||
        (MC[c + "_" + (e | 0)] = new THREE.MeshLambertMaterial({
          color: c,
          emissive: e ? c : 0,
        }));
      const shade = (h, f) => new THREE.Color(h).multiplyScalar(f).getHex();
      function V(g, l) {
        for (const [w, h, d, x, y, z, c, e] of l) {
          const m = new THREE.Mesh(UB, L(c, e));
          m.scale.set(w, h, d);
          m.position.set(x, y, z);
          m.castShadow = true;
          m.add(new THREE.LineSegments(UE, OL));
          g.add(m);
        }
        return g;
      }
      const G = () => new THREE.Group();
      function pt(cols, w = 16, h = 16) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const x = c.getContext("2d");
        for (let i = 0; i < w; i++)
          for (let j = 0; j < h; j++) {
            x.fillStyle = cols[(Math.random() * cols.length) | 0];
            x.fillRect(i, j, 1, 1);
          }
        const t = new THREE.CanvasTexture(c);
        t.magFilter = t.minFilter = THREE.NearestFilter;
        return t;
      }
      function planet(r, cols) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(r, 12, 8),
          new THREE.MeshBasicMaterial({ map: pt(cols, 32, 16), fog: false }),
        );
        m.visible = false;
        sc.add(m);
        return m;
      }
      const moonP = planet(1, ["#a9a9b4", "#8f8f9c", "#7a7a88", "#bdbdc8"]),
        marsP = planet(1, ["#c1532a", "#a8431f", "#d9703a", "#8a3418"]),
        earth = planet(14, [
          "#1d63b8",
          "#1d63b8",
          "#1a4f9e",
          "#2c7a3f",
          "#2c7a3f",
          "#ffffff",
        ]);
      moonP.scale.setScalar(14);
      marsP.scale.setScalar(16);
      /* ---------- terrain ---------- */
      const N = 51,
        HF = 25,
        S = 2,
        HT = new Float32Array(N * N),
        gm = new THREE.BoxGeometry(S, 1, S);
      gm.translate(0, 0.5, 0);
      const tm = new THREE.InstancedMesh(

            dx = g.x - p.x,
            dz = g.z - p.z,
            d = Math.hypot(dx, dz) || 1,
            x = dx / d,
            z = dz / d;
          cd.set(p.x - x * 4 + z * 4, p.y + 4.2, p.z - z * 4 - x * 4);
          cl.set(g.x, p.y + (g.y - p.y) * 0.6 + 1, g.z);
        } else {
          cd.set(
            p.x + Math.sin(ang) * 11 * zoom,
            p.y + 6.5 * zoom,
            p.z + Math.cos(ang) * 11 * zoom,
          );
          cl.set(p.x, p.y + 1.5, p.z - 3);
        }
      }
      function stamp(p, h) {
        for (const s of [-1.15, 1.15]) {
          const x = p.x + Math.cos(h) * s,
            z = p.z - Math.sin(h) * s;
          V3.set(x, gy(x, z) + 0.05, z);
          EU.set(0, h, 0);
          q3.setFromEuler(EU);
          M4.compose(V3, q3, new THREE.Vector3(0.45, 0.1, 1));
          tk.setMatrixAt(tki++ % 160, M4);
        }
        tk.instanceMatrix.needsUpdate = true;
      }
      function loop() {
        requestAnimationFrame(loop);
        const dt = Math.min(clk.getDelta(), 0.05),
          t = clk.elapsedTime,
          p = rv.position;
        let warp = 0;
        const e = tr ? (tr.t += dt) : 0;
        if (tr) {
          if (e < 0.5) {
            if (W.visible) {
              const q = sm(e / 0.5);
              dimf = 1 - 0.85 * q;
              bg(new THREE.Color().copy(sky).lerp(BLK, q));
              cam.position.set(p.x, 5 + q * 40, p.z + 11 + q * 14);
              lk.set(p.x, 2 + q * 50, p.z - 5);
            }
          } else if (e < 1.5) {
            W.visible = false;
            dimf = 1;
            stm.opacity = 1;
            if (e >= 1 && !tr.sw) {
              tr.sw = 1;
              setWorld(tr.to);
              bg(BLK);
              W.visible = false;
              stm.opacity = 1;
            }
            cam.position.set(0, 0, 0);
            lk.set(0, 0, -10);
            warp = e < 1 ? sm((e - 0.5) / 0.4) : 1 - 0.65 * sm((e - 1) / 0.5);
          } else {
            if (!tr.ti) {
              tr.ti = 1;
              W.visible = true;
              bg(sky);
              stm.opacity = C[cur].st;
              dimf = 1;
              $("ti").querySelector("h3").textContent = "Chapter " + (cur + 1);
              $("ti").querySelector("h1").textContent = C[cur].t;
              $("ti").querySelector("p").textContent = C[cur].q;
              $("ti").classList.remove("show");
              void $("ti").offsetWidth;
              $("ti").classList.add("show");
            }
            const q = sm((e - 1.5) / 0.5);
            pose();
            cam.position.set(
              p.x + (cd.x - p.x) * q,
              p.y + 45 + (cd.y - p.y - 45) * q,
              p.z + 30 + (cd.z - p.z - 30) * q,
            );
            lk.set(p.x, p.y * q + 1.5 - (1 - q) * 10, p.z - 3 - (1 - q) * 8);
            $("fx").style.opacity =
              e < 1.8 ? 0.9 * (1 - (e - 1.5) / 0.3) * (cur === 1 ? 0.7 : 1) : 0;
            if (e >= 2) {
              tr = null;
              st = "chap";
              $("lbs").style.display = "block";
              hud();
            }
          }
          cam.lookAt(lk);
        } else if (!W.visible) {
          cam.position.set(Math.sin(t * 0.1) * 3, Math.sin(t * 0.2), 0);
          cam.lookAt(0, 0, -50);
        } else {
          if (st === "drive") {
            const dx = dest.x - p.x,
              dz = dest.z - p.z,
              d = Math.hypot(dx, dz);
            if (d < 0.08) {
              st = "scan";
              sct = 0;
              sph = 0;
              bm.visible = true;
            } else {
              const s = Math.min(d, 24 * dt);
              p.x += (dx / d) * s;
              p.z += (dz / d) * s;
              turn(Math.atan2(dx, dz), dt);
              rv.userData.ws.forEach((w) => (w.rotation.x += s / 0.45));
              if (p.distanceTo(lastT) > 1.1) {
                stamp(p, rv.rotation.y);
                lastT.copy(p);
              }
            }
          }
          if (st === "scan") {
            const o = OB[sub],
              g = o.g.position;
            turn(Math.atan2(g.x - p.x, g.z - p.z), dt);
            sct += dt;
            const k = found.has(C[cur].subs[sub].id) ? 3 : 0,
              ms = $("ms"),
              ph = sct < 0.6 ? 1 : sct < 1.1 ? 2 : sct < 1.7 ? 3 : 4;
            if (ph !== sph && !k) {
              sph = ph;
              ms.textContent = [
                "",
                "Scanning…",
                "Signal detected",
                "Discovery: " + C[cur].subs[sub].full,
                "",
              ][ph];
              if (ph < 4) blip(500 + ph * 250, 900 + ph * 300, 0.15);
            }
            V3.set(p.x, p.y + 2.6, p.z);
            bm.position.copy(V3).lerp(g, 0.5);
            bm.scale.set(0.1 + 0.05 * Math.sin(t * 30), 0.1, V3.distanceTo(g));
            bm.lookAt(g);
            if (k ? sct > 0.3 : sct > 1.7) {
              st = "sub";
              bm.visible = false;
              ms.textContent = "";
              found.add(C[cur].subs[sub].id);
              panel(sub);
              hud();
            }
          }
          p.y += (gy(p.x, p.z) - p.y) * Math.min(1, dt * 14);
          const u = rv.userData;
          u.hd.rotation.y = Math.sin(t * 0.8) * 0.35;
          u.led.visible = ((t * 2) | 0) % 2 === 0;
          pose();
          const k = 1 - Math.exp(-dt * 5.5);
          cam.position.lerp(cd, k);
          lk.lerp(cl, k);
          cam.lookAt(lk);
          OB.forEach((o, i) => {
            const g = o.g,
              s = C[cur].subs[i];
            if (s.fl) {
              g.position.set(
                o.bx + Math.sin(t * 0.35) * 2.5,
                o.by + Math.sin(t * 1.2) * 0.4,
                o.bz + Math.cos(t * 0.35) * 1.5,
              );
              g.rotation.y = t * 0.3;
            }
            o.hl.visible = i === sub ? true : ((t * 2.5) | 0) % 2 === 0;
            if (st === "chap" || st === "sub") {
              V3.set(g.position.x, g.position.y + o.top, g.position.z).project(
                cam,
              );
              o.b.style.display = V3.z < 1 ? "" : "none";
              o.b.style.transform =
                "translate(" +
                (V3.x * 0.5 + 0.5) * innerWidth +
                "px," +
                (-V3.y * 0.5 + 0.5) * innerHeight +
                "px) translate(-50%,-100%)";
            }
          });
          sun.position.set(p.x - 22, 17, p.z - 6);
          sun.target.position.copy(p);
          const c = C[cur],
            P = pg.attributes.position;
          pm.opacity = 0.8;
          for (let i = 0; i < PN; i++) {
            let x = P.getX(i) + c.v[0] * dt,
              y = P.getY(i) + c.v[1] * dt * (0.6 + (i % 5) * 0.2),
              z = P.getZ(i);
            if (x - p.x > 20) x -= 40;
            if (x - p.x < -20) x += 40;
            if (y > 10) y = 0;
            if (z - p.z > 20) z -= 40;
            if (z - p.z < -20) z += 40;
            P.setXYZ(i, x, y, z);
          }
          P.needsUpdate = true;
        }
        /* lighting, sky bodies */
        const c = C[cur] || C[0];
        amb.intensity = 0.8 * dimf;
        sun.intensity = c.lt * dimf;
        const space = !W.visible && !tr;
        moonP.visible = marsP.visible = earth.visible = false;
        if (space) {
          moonP.visible = marsP.visible = earth.visible = true;
          moonP.position.set(-32, 4, -100);
          marsP.position.set(38, -3, -120);
          earth.position.set(0, 26, -175);
          earth.scale.setScalar(1.7);
          moonP.rotation.y = t * 0.05;
          marsP.rotation.y = t * 0.04;
          earth.rotation.y = t * 0.03;
        } else if (tr && e >= 1 && e < 1.5) {
          const q = sm((e - 1) / 0.5),
            d = tr.to === 0 ? moonP : marsP;
          d.visible = true;
          d.position.set(0, 0, -170 + q * 80);
          d.scale.setScalar((tr.to === 0 ? 14 : 16) * (0.4 + q * 1.6));
          d.rotation.y = t * 0.2;
        } else if (W.visible && cur >= 0) {
          earth.visible = c.es > 0;
          earth.scale.setScalar(c.es);
          earth.position.set(
            cur === 0 ? -60 + Math.sin(t * 0.05) * 6 : 70,
            cur === 0 ? 42 : 50,
            -130,
          );
          earth.rotation.y = t * 0.03;
        }
        stars.position.copy(cam.position);
        stl.visible = warp > 0;
        if (warp > 0) {
          const a = stg.attributes.position;
          stl.material.opacity = Math.min(1, warp * 1.2);
          for (let i = 0; i < SN; i++) {
            const s = sx[i];
            s[2] += warp * 160 * dt;
            if (s[2] > 5) s[2] = -120;
            a.setXYZ(i * 2, s[0], s[1], s[2]);
            a.setXYZ(i * 2 + 1, s[0], s[1], s[2] - warp * 14);
          }
          a.needsUpdate = true;
        }
        R.render(sc, cam);
      }
      function turn(h, dt) {
        let d =
          ((((h - rv.rotation.y + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) %
            (2 * Math.PI)) -
          Math.PI;
        rv.rotation.y += d * Math.min(1, dt * 10);
      }
      loop();
    </script>
  </body>
</html>
